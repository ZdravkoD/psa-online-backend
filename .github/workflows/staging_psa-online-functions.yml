name: Build and deploy Python project to Azure Function App - psa-online-functions

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      force_run_azure_functions_jobs:
        description: 'Force run Azure Functions jobs'
        required: false
        default: 'false'
      force_run_aci_jobs:
        description: 'Force run Azure Container Instance jobs'
        required: false
        default: 'false'
  
env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'azure-functions' # set this to the path to your functions directory
  PYTHON_VERSION: '3.11' # set this to the python version to use
  DOCKER_IMAGE_NAME: 'psa-online-scraper'
  DOCKER_PLATFORM: 'linux/amd64' # set this for Docker build if needed

jobs:
  check-changed-dirs:
    runs-on: ubuntu-latest
    outputs:
      scraper_should_run: ${{ steps.check_scraper_should_run.outputs.scraper_should_run }}
      azure_functions_should_run: ${{ steps.check_azure_functions_should_run.outputs.azure_functions_should_run }}    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetch the last 2 commits to ensure we can compare HEAD and HEAD^

      - name: Get list of directories with changes
        id: get_changed_dirs
        run: |
          CHANGED_DIRS=$(git diff --name-only HEAD^ HEAD | xargs -I {} dirname {} | sort | uniq | tr '\n' ';')
          echo "Changed directories:"
          echo "$CHANGED_DIRS"
          echo "changed_dirs=$CHANGED_DIRS" >> $GITHUB_OUTPUT
      
      - name: Check if scraper or workflow files changed
        id: check_scraper_should_run
        run: |
          if echo "${{ steps.get_changed_dirs.outputs.changed_dirs }}" | grep -qE 'scraper.*|\.github/workflows.*'; then
            echo "scraper_should_run=true" >> $GITHUB_OUTPUT
            echo "scraper_should_run=true"
          else
            echo "scraper_should_run=false" >> $GITHUB_OUTPUT
            echo "scraper_should_run=false"
          fi
      
      - name: Check if Azure Functions files changed
        id: check_azure_functions_should_run
        run: |
          if echo "${{ steps.get_changed_dirs.outputs.changed_dirs }}" | grep -qE 'azure-functions.*|\.github/workflows.*'; then
            echo "azure_functions_should_run=true" >> $GITHUB_OUTPUT
            echo "azure_functions_should_run=true"
          else
            echo "azure_functions_should_run=false" >> $GITHUB_OUTPUT
            echo "azure_functions_should_run=false"
          fi
  
  build-azure-functions:
    needs: check-changed-dirs
    if: github.event.inputs.force_run_azure_functions_jobs == 'true' || needs.check-changed-dirs.outputs.azure_functions_should_run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: 'staging'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies and package functions
        run: |
          python -m venv venv
          source venv/bin/activate
          find azure-functions -name requirements.txt -execdir pip install -r {} \;

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip azure-functions -x "*/venv/*" -x "*/.venv/*" -x "*/__pycache__/*" -x "*/local.settings.json" "*/.gitignore" "*/node_modules/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip
                    
  deploy-azure-functions:
    runs-on: ubuntu-latest
    needs: build-azure-functions
    environment:
      name: 'staging'
      url: ${{ steps.deploy-to-function.outputs.webapp-url }}
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip release.zip     

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'psa-online-functions'
          slot-name: 'staging'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A9BD903092ED444AB794B1B8EDB62D1D }}

  build-and-test-scraper:
    needs: check-changed-dirs
    if: github.event.inputs.force_run_aci_jobs == 'true' || needs.check-changed-dirs.outputs.scraper_should_run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: 'staging'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

  deploy-scraper-to-aci:
    runs-on: ubuntu-latest
    needs: build-and-test-scraper
    environment:
      name: 'staging'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          buildkitd-flags: --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host

      - name: Cache Docker layers
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to Azure
        uses: azure/login@v1
        with:
          # az ad sp show --id 45f08d0f-5389-4fef-9c35-78f119d355ac
          # {
          #   "clientSecret":  "******",
          #   "subscriptionId":  "******",
          #   "tenantId":  "******",
          #   "clientId":  "******"
          # }
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and push Docker image with timestamp tag
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          platforms: ${{ env.DOCKER_PLATFORM }}
          context: ./scraper
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
      
      - name: Stop existing Azure Container Instance
        run: |
          if az container show --name scraper-container --resource-group psa; then
            echo "Container exists. Stopping it..."
            az container stop --name scraper-container --resource-group psa
          else
            echo "Container does not exist. Skipping stop command."
          fi

      - name: Wait for container to stop
        run: |
          if ! az container show --name scraper-container --resource-group psa; then
            echo "Container does not exist. Skipping wait command."
            exit 0
          fi
          # Loop until the container is not in the 'Running' state
          while true; do
            # Get the current state of the container
            state=$(az container show --name scraper-container --resource-group psa --query "containers[0].instanceView.currentState.state" -o tsv)
            
            echo "Current state: $state"
  
            # Break the loop if the state is 'Stopped'
            if [ "$state" == "Stopped" ] || [ "$state" == "Terminated" ]; then
              echo "Container has stopped."
              break
            elif [ "$state" == "Failed" ]; then
              echo "Container provisioning failed."
              exit 1
            fi
  
            # Sleep for a while before polling again
            echo "Waiting for container to stop..."
            sleep 10
          done

      - name: Remove existing Azure Container Instance
        run: |
          if az container show --name scraper-container --resource-group psa; then
            echo "Container exists. Deleting it..."
            az container delete --name scraper-container --resource-group psa --yes
          else
            echo "Container does not exist. Skipping delete command."
          fi

      - name: Retrieve secrets from Key Vault
        id: get-secrets
        run: |
          RESOURCE_GROUP="psa"
          CONTAINER_GROUP_NAME="scraper-container"
          CONTAINER_NAME="scraper-container"
          KEY_VAULT_NAME="psa-staging-kv"

          AZURE_SERVICE_BUS_CONNECTION_STRING=$(az keyvault secret show --vault-name $KEY_VAULT_NAME --name azure-service-bus-connection-string --query value -o tsv)
          AZURE_BLOB_STORAGE_CONNECTION_STRING=$(az keyvault secret show --vault-name $KEY_VAULT_NAME --name azure-blob-storage-connection-string --query value -o tsv)
          AZURE_COSMOS_DB_CONNECTION_STRING=$(az keyvault secret show --vault-name $KEY_VAULT_NAME --name azure-cosmosdb-connection-string --query value -o tsv)
          STING_CONFIG=$(az keyvault secret show --vault-name $KEY_VAULT_NAME --name sting-config --query value -o tsv)
          PHOENIX_CONFIG=$(az keyvault secret show --vault-name $KEY_VAULT_NAME --name phoenix-config --query value -o tsv)
          
          echo "AZURE_SERVICE_BUS_CONNECTION_STRING=${AZURE_SERVICE_BUS_CONNECTION_STRING}" >> $GITHUB_ENV
          echo "AZURE_BLOB_STORAGE_CONNECTION_STRING=${AZURE_BLOB_STORAGE_CONNECTION_STRING}" >> $GITHUB_ENV
          echo "AZURE_COSMOS_DB_CONNECTION_STRING=${AZURE_COSMOS_DB_CONNECTION_STRING}" >> $GITHUB_ENV
          echo "STING_CONFIG=${STING_CONFIG}" >> $GITHUB_ENV
          echo "PHOENIX_CONFIG=${PHOENIX_CONFIG}" >> $GITHUB_ENV
      - name: Debug List scraper directory
        run: ls -R scraper
      - name: Deploy new Azure Container Instance
        uses: nick-fields/retry@v3.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_on: error
          command: |
            # Deploy the container group declaratively via an ARM template so the
            # imageRegistryCredentials can reference the user-assigned identity.
            # Assumptions:
            # - The user-assigned identity resource already exists at the CONTAINER_IDENTITY value.
            # - The container image does not expose an HTTP health endpoint; we use an exec-based probe to verify a running process.
            #   If your image exposes an HTTP /health endpoint, replace the exec probes with httpGet probes and set the container port.

            cd scraper
            IMAGE_NAME=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            CONTAINER_IDENTITY="/subscriptions/7b4dbc02-6b4b-42bf-90b2-92d8ed681e87/resourceGroups/psa/providers/Microsoft.ManagedIdentity/userAssignedIdentities/scraper-identity"

            # Properly escape JSON strings for environment variables
            ESCAPED_STING_CONFIG=$(echo "$STING_CONFIG" | jq -sRr @json)
            ESCAPED_PHOENIX_CONFIG=$(echo "$PHOENIX_CONFIG" | jq -sRr @json)

            # Ensure the user-assigned managed identity has AcrPull on the ACR (idempotent)
            PRINCIPAL_ID=$(az identity show --ids "$CONTAINER_IDENTITY" --query principalId -o tsv)
            ACR_NAME=$(echo "${{ secrets.ACR_LOGIN_SERVER }}" | cut -d. -f1)
            ACR_ID=$(az acr show --name "$ACR_NAME" --resource-group psa --query id -o tsv)
            if [ -z "$PRINCIPAL_ID" ] || [ -z "$ACR_ID" ]; then
              echo "Skipping role assignment: missing principalId or ACR id"
            else
              existing=$(az role assignment list --scope "$ACR_ID" --assignee "$PRINCIPAL_ID" --query "length(@)" -o tsv)
              if [ "$existing" -eq 0 ]; then
                echo "Creating AcrPull role assignment for principal $PRINCIPAL_ID on $ACR_ID"
                az role assignment create --assignee "$PRINCIPAL_ID" --role AcrPull --scope "$ACR_ID" || true
              else
                echo "AcrPull role assignment already exists"
              fi
            fi

            # Deploy the template from the repository
            az deployment group create \
              --resource-group psa \
              --template-file aci-template.json \
              --parameters \
                containerGroupName="scraper-container" \
                location="francecentral" \
                imageName="$IMAGE_NAME" \
                containerIdentityId="$CONTAINER_IDENTITY" \
                registryServer="${{ secrets.ACR_LOGIN_SERVER }}" \
                alerterEmail="${{ secrets.ALERTER_EMAIL }}" \
                envStingConfig="$ESCAPED_STING_CONFIG" \
                envPhoenixConfig="$ESCAPED_PHOENIX_CONFIG" \
                envServiceBusConn="$AZURE_SERVICE_BUS_CONNECTION_STRING" \
                envBlobConn="$AZURE_BLOB_STORAGE_CONNECTION_STRING" \
                envCosmosConn="$AZURE_COSMOS_DB_CONNECTION_STRING"

# Context for resetting Azure Service Principal credentials and updating GitHub secrets
# Commands to execute:
# 1. az ad sp credential reset --id 45f08d0f-5389-4fef-9c35-78f119d355ac
#    - Output mapping:
#      - appId -> AZURE_CLIENT_ID
#      - password -> AZURE_CLIENT_SECRET
#      - tenant -> AZURE_TENANT_ID
# 2. az account show --query id -o tsv
#    - Output:
#      - subscriptionId -> AZURE_SUBSCRIPTION_ID
#
# JSON structure for GitHub secrets:
# {
#   "AZURE_CLIENT_ID": "<appId>",
#   "AZURE_CLIENT_SECRET": "<password>",
#   "AZURE_TENANT_ID": "<tenant>",
#   "AZURE_SUBSCRIPTION_ID": "<subscriptionId>"
# }

